name: merge gate

# The required check for landing: the Kit suite headless on macOS, the coupling
# gates, and the app compiled for both machines it ships to, each the way its
# install script builds it. The sanitize guard runs locally through the git
# hooks — a public checkout has no blocklist overlay, so the guard exits quietly
# here and is not what this gate is for.

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  kit-and-gates:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Kit suite
        run: cd WarmGunKit && swift test
      - name: Coupling gates
        run: python3 tools/gates.py
      - name: App for the Mac
        run: >-
          xcodebuild -project WarmGun.xcodeproj -scheme WarmGun
          -destination 'generic/platform=macOS' -configuration Release
          CODE_SIGNING_ALLOWED=NO -quiet build
      - name: App for the phone
        run: >-
          xcodebuild -project WarmGun.xcodeproj -scheme WarmGun
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO -quiet build
